name: opportunity-scan
on:
  push:
    branches: [main]
    paths:
      - "src/ai_worker/**"
      - "pyproject.toml"
      - ".github/workflows/opportunity-scan.yml"
  workflow_dispatch:
    inputs:
      min_reward:
        description: "Minimum USD/USDC reward"
        required: false
        default: "5"
        type: string
      limit:
        description: "Maximum feed records to inspect"
        required: false
        default: "1000"
        type: string
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
concurrency:
  group: ai-worker-opportunity-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore recent SQLite opportunity ledger
        uses: actions/cache@v4
        with:
          path: data/ai_worker.sqlite3
          key: ai-worker-ledger-\${{ github.run_id }}
          restore-keys: |
            ai-worker-ledger-
      - name: Install AI-Worker
        run: python -m pip install .
      - name: Scan public bounty feed
        env:
          MIN_REWARD: \${{ inputs.min_reward || '5' }}
          FEED_LIMIT: \${{ inputs.limit || '1000' }}
        run: ai-worker scan --limit "$FEED_LIMIT" --min-reward "$MIN_REWARD" --db data/ai_worker.sqlite3 --output reports/latest.md
      - name: Publish scan report artifact
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-scan-\${{ github.run_id }}
          path: |
            reports/latest.md
            data/ai_worker.sqlite3
          if-no-files-found: error
          retention-days: 14
